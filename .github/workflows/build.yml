name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate configs
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Check README changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "⚠️ 构建产生了未提交的变更，请运行 pnpm build 并提交："
            git status --short
            exit 1
          fi
